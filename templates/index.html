<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chronos Tactics: The Linked Battle</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="container">

        <h1>CRONOS TACTICS: The Linked Battle</h1>

        <section id="menu-utama">

            <button onclick="mulaiGame()">
                Mulai Game
            </button>

            <button onclick="bukaSettings()">
                Settings
            </button>

        </section>


        <!-- ==================================================
             PROLOG + PEMILIHAN KARAKTER
        ================================================== -->

        <section id="prolog" class="hidden">

            <div id="teks-prolog"></div>

            <div id="pilihan-karakter">

                <button
                    class="tombol-karakter"
                    data-karakter="elsa"
                    onclick="pilihkarakter('elsa')">
                    Elsa
                </button>

                <button
                    class="tombol-karakter"
                    data-karakter="bruno"
                    onclick="pilihkarakter('bruno')">
                    Bruno
                </button>

                <button
                    class="tombol-karakter"
                    data-karakter="dewa"
                    onclick="pilihkarakter('dewa')">
                    Dewa
                </button>

                <button
                    class="tombol-karakter"
                    data-karakter="joy"
                    onclick="pilihkarakter('joy')">
                    Joy
                </button>

                <button
                    class="tombol-karakter"
                    data-karakter="mikasa"
                    onclick="pilihkarakter('mikasa')">
                    Mikasa
                </button>

            </div>

            <div id="navigasi-prolog">

                <button onclick="siapBertarung()">
                    Siap
                </button>

                <button onclick="kembaliKeMenuUtama()">
                    Kembali
                </button>

            </div>

        </section>


        <!-- ==================================================
             PERTARUNGAN
        ================================================== -->

        <section id="menu-game" class="hidden">

            <h2>Pertarungan</h2>

            <p id="status-pertarungan">
                Game masih dalam tahap development.
            </p>

            <div id="aksi-karakter"></div>

            <button onclick="kirimAksi('kabur')">
                Kabur
            </button>

            <button onclick="kembaliKeMenuUtama()">
                Kembali
            </button>

        </section>


        <!-- ==================================================
             MENU SETTINGS
        ================================================== -->

        <div id="pesan-pemain"></div>

        <section id="menu-settings" class="hidden">

            <button onclick="pilihSubSettings('Audio')">
                Audio
            </button>

            <button onclick="pilihSubSettings('Grafis')">
                Grafis
            </button>

            <button onclick="kembaliKeMenuUtama()">
                Kembali
            </button>

        </section>

    </main>


    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main_menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game_menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings_menu.js') }}"></script>

</body>

</html>
