<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chronos Tactics: The Linked Battle</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="container">

        <h1>CRONOS TACTICS: The Linked Battle</h1>

        <!-- Log internal, tidak terlihat pemain -->
        <div id="status" class="hidden"></div>

        <!-- Pesan yang ditampilkan kepada pemain -->
        <div id="pesan-pemain"></div>


        <!-- ==================================================
             MENU UTAMA
        =================================================== -->

        <section id="menu-utama">

            <button onclick="mulaiGame()">
                Mulai Game
            </button>

            <button onclick="bukaSettings()">
                Settings
            </button>

        </section>


        <!-- ==================================================
            PROLOG-SETELAH-MULAI-GAME
        ================================================== -->

        <section id="prolog" class="hidden">

            <div id="teks-prolog"></div>

        </section>

        <!-- ==================================================
             MENU SETTINGS
        =================================================== -->

        <section id="menu-settings" class="hidden">

            <button onclick="pilihSubSettings('Audio')">
                Audio
            </button>

            <button onclick="pilihSubSettings('Grafis')">
                Grafis
            </button>

            <button onclick="kembaliKeMenuUtama()">
                Kembali
            </button>

        </section>

    </main>


    <!-- JavaScript aplikasi -->
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>

</body>

</html>
